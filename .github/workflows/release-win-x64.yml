name: Release Fluent PDF for Windows x64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # R2 retention is shared by all versions; serialize uploads and cleanup.
  group: release-win-x64
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: CLOUDFLARE_TOKEN

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -Raw "src/pdf_fluent.csproj")
          $versionNode = $project.SelectSingleNode(
            "/Project/PropertyGroup/Version"
          )

          if ($null -eq $versionNode) {
            throw "src/pdf_fluent.csproj does not contain <Version>."
          }

          $version = $versionNode.InnerText.Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use the stable format x.y.z: $version"
          }

          $expectedTag = "v$version"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match $expectedTag."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate release notes from commits
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          # --current follows the checked-out tag, including when an old run is retried.
          args: --current --offline
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
          RELEASE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

#      - name: Run tests
#        run: dotnet test pdf_fluent.slnx --configuration Release

      - name: Publish self-contained win-x64 application
        shell: pwsh
        run: |
          # ReadyToRun is intentional. The PDFiumCore IFSDK_PAUSE callback
          # delegate is rooted in PDFiumService.RenderPageIntoBuffer; do not
          # disable R2R to work around a PDF-open hang.
          dotnet publish src/pdf_fluent.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true `
            -p:PublishReadyToRunComposite=true `
            -p:DebugType=embedded `
            --output artifacts/publish/win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install `
            --id JRSoftware.InnoSetup `
            --exact `
            --source winget `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sourceDir = (Resolve-Path "artifacts/publish/win-x64").Path

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts/installer" | Out-Null

          $outputDir = (Resolve-Path "artifacts/installer").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found at $iscc"
          }

          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "installer/PDFFluent.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluent-PDF-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Fluent PDF v${{ steps.version.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.changelog }}
          generate_release_notes: false
          files: artifacts/installer/*.exe
          fail_on_unmatched_files: true

      - name: Upload installer to R2 and retain the latest three versions
        shell: pwsh
        env:
          # Full S3 bucket URL, e.g. https://<account-id>.r2.cloudflarestorage.com/pdf-fluent
          API_URL: ${{ secrets.API_URL }}
          # Original Cloudflare R2 API token value, NOT the S3 Secret Access Key.
          API_TOKEN: ${{ secrets.API_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "5"
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:API_URL) -or
              [string]::IsNullOrWhiteSpace($env:API_TOKEN)) {
            throw 'GitHub secrets API_URL and API_TOKEN are required for R2 publishing.'
          }

          $bucketUri = [uri]$env:API_URL.Trim()
          if ($bucketUri.Scheme -ne 'https' -or
              $bucketUri.Host -notmatch '^(?<account>[a-f0-9]{32})(?:\.(?:eu|us|fedramp))?\.r2\.cloudflarestorage\.com$' -or
              $bucketUri.Query -or $bucketUri.Fragment -or $bucketUri.UserInfo -or
              -not $bucketUri.IsDefaultPort) {
            throw 'API_URL must be an HTTPS R2 S3 bucket URL without credentials, query parameters or fragments.'
          }

          $accountId = $Matches.account
          $bucket = $bucketUri.AbsolutePath.Trim('/')
          if ($bucket -notmatch '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$') {
            throw 'API_URL must include exactly one bucket name after the hostname.'
          }
          $endpoint = $bucketUri.GetLeftPart([System.UriPartial]::Authority)

          # Both account API tokens and user API tokens are supported. Cloudflare
          # defines S3 Access Key ID = token ID; Secret Access Key = SHA256(token).
          # https://developers.cloudflare.com/r2/api/tokens/#get-s3-api-credentials-from-an-api-token
          $token = $env:API_TOKEN.Trim()
          $headers = @{ Authorization = "Bearer $token" }
          $accessKeyId = $null
          $verifyUrls = @(
            "https://api.cloudflare.com/client/v4/accounts/$accountId/tokens/verify",
            'https://api.cloudflare.com/client/v4/user/tokens/verify'
          )
          foreach ($verifyUrl in $verifyUrls) {
            $response = Invoke-WebRequest -Uri $verifyUrl -Headers $headers `
              -SkipHttpErrorCheck -TimeoutSec 60 -MaximumRetryCount 3 -RetryIntervalSec 2
            if ([int]$response.StatusCode -ne 200) {
              continue
            }
            $verification = $response.Content | ConvertFrom-Json
            if ($verification.success -eq $true -and
                $verification.result.status -eq 'active' -and
                $verification.result.id -match '^[a-f0-9]{32}$') {
              $accessKeyId = $verification.result.id
              break
            }
          }
          if (-not $accessKeyId) {
            throw 'Could not verify API_TOKEN. Use the original active R2 API token with Object Read & Write permission for this bucket, not its S3 Secret Access Key.'
          }

          $secretAccessKey = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData(
              [System.Text.Encoding]::UTF8.GetBytes($token)
            )
          ).ToLowerInvariant()
          Write-Output "::add-mask::$accessKeyId"
          Write-Output "::add-mask::$secretAccessKey"
          $env:AWS_ACCESS_KEY_ID = $accessKeyId
          $env:AWS_SECRET_ACCESS_KEY = $secretAccessKey

          $fileName = "Fluent PDF Setup $env:RELEASE_VERSION win-x64.exe"
          $installer = Get-Item -LiteralPath (Join-Path 'artifacts/installer' $fileName)
          if ($installer.Length -eq 0) {
            throw 'The installer is empty; R2 publishing has been stopped.'
          }
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          # AWS CLI is preinstalled on windows-latest. Always upload and verify
          # the new installer before deleting any previous version.
          aws s3 cp $installer.FullName "s3://$bucket/$fileName" `
            --endpoint-url $endpoint --only-show-errors --no-progress `
            --content-type application/vnd.microsoft.portable-executable `
            --metadata "sha256=$sha256" --cache-control 'public, max-age=31536000, immutable'
          if ($LASTEXITCODE -ne 0) {
            throw 'R2 installer upload failed; old versions have not been deleted.'
          }

          $headJson = aws s3api head-object --bucket $bucket --key $fileName `
            --endpoint-url $endpoint --output json
          if ($LASTEXITCODE -ne 0) {
            throw 'R2 upload verification failed; old versions have not been deleted.'
          }
          $head = $headJson | ConvertFrom-Json
          if ($head.ContentLength -ne $installer.Length) {
            throw 'R2 installer size does not match; old versions have not been deleted.'
          }

          # AWS CLI automatically retrieves all pages. Match only this app's
          # installer keys, so unrelated bucket objects are never deleted.
          $listJson = aws s3api list-objects-v2 --bucket $bucket `
            --prefix 'Fluent PDF Setup ' --endpoint-url $endpoint --output json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list R2 installers; old versions have not been deleted.'
          }
          $listing = $listJson | ConvertFrom-Json
          $installers = @(
            foreach ($item in $listing.Contents) {
              if ($item.Key -cmatch '^Fluent PDF Setup (?<version>\d+\.\d+\.\d+) win-x64\.exe$') {
                [pscustomobject]@{ Key = $item.Key; Version = [version]$Matches.version }
              }
            }
          )
          if ($fileName -cnotin $installers.Key) {
            throw 'The uploaded installer was not listed in R2; cleanup has been stopped.'
          }

          # Numeric version order: 1.10.0 is newer than 1.9.0. Re-running an old
          # release must not evict newer releases because of its upload date.
          $versions = @($installers.Version | Sort-Object -Descending -Unique)
          $keep = @($versions | Select-Object -First 3)
          if ([version]$env:RELEASE_VERSION -eq $versions[0]) {
            # Publish the manifest only after the referenced installer is available.
            # An older tag rerun must never roll the update channel backwards.
            $manifest = [ordered]@{
              schemaVersion = 1
              version = $env:RELEASE_VERSION
              downloadUrl = "https://pdf-fluent.yichen.xyz/$([uri]::EscapeDataString($fileName))"
              size = $installer.Length
              sha256 = $sha256
              publishedAt = [DateTimeOffset]::UtcNow.ToString('O')
            }
            $manifestPath = Join-Path 'artifacts/installer' 'config.json'
            $manifest | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
            aws s3 cp $manifestPath "s3://$bucket/config.json" `
              --endpoint-url $endpoint --only-show-errors --no-progress `
              --content-type 'application/json; charset=utf-8' --cache-control 'no-store, max-age=0'
            if ($LASTEXITCODE -ne 0) {
              throw 'R2 update manifest upload failed; old versions have not been deleted.'
            }
          }
          else {
            Write-Output 'Skipping manifest publication for an older release.'
          }
          foreach ($item in $installers) {
            if ($item.Version -notin $keep) {
              Write-Output "Removing old R2 installer: $($item.Key)"
              aws s3api delete-object --bucket $bucket --key $item.Key `
                --endpoint-url $endpoint --output json | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to delete an old R2 installer.'
              }
            }
          }
          Write-Output "R2 installer versions retained: $($keep -join ', ')"
